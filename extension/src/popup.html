<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bluff Checkout Guard</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 320px; background: #0e1014; color: #f6f4ef; font: 14px/1.45 Inter, system-ui, sans-serif; }
  #app { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: center; gap: 10px; }
  h1 { margin: 0; font: 700 16px "Space Grotesk", system-ui, sans-serif; }
  h2 { margin: 6px 0 0; font: 500 12px "Space Grotesk", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: #c8c8ce; }
  p { margin: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #2f9e6e; box-shadow: 0 0 0 3px rgba(47, 158, 110, .25); flex: none; }
  .dim { color: #c8c8ce; font-size: 12px; }
  .foot { margin-top: 4px; }
  a.btn { display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 8px; border: 1px solid #2a2a31; background: #1d212a; color: #f6f4ef; font-weight: 600; text-decoration: none; padding: 0 12px; text-align: center; }
  a.btn:hover { filter: brightness(1.15); }
  a.pri { background: #5b5bd6; border-color: #5b5bd6; }
  .try { display: grid; gap: 8px; }
  ul.safe { list-style: none; margin: 0; padding: 0; border: 1px solid #2a2a31; border-radius: 8px; background: #161920; }
  ul.safe li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 10px; }
  ul.safe li + li { border-top: 1px solid #2a2a31; }
  ul.safe span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.rm { font: 600 12px inherit; font-family: inherit; min-height: 32px; border-radius: 8px; border: 1px solid #2a2a31; background: #1d212a; color: #f6f4ef; padding: 0 10px; cursor: pointer; }
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script src="popup.js"></script>
</body>
</html>
