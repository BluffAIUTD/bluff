# Bluff on one Vultr VPS: db (self-hosted TimescaleDB, Tiger Data's open-source Postgres) + web (Next standalone)
# + caddy (HTTPS for the app and the demo storefront websites). Copy .env.example to .env and fill it in. See DEPLOY.md.
services:
  db:
    # TimescaleDB on Postgres 17 (includes pg_trgm and pgcrypto). Private to the compose network: no published port.
    image: timescale/timescaledb:2.21.3-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluff
      POSTGRES_DB: bluff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "max_connections=100", "-c", "shared_buffers=512MB", "-c", "timescaledb.telemetry_level=off"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluff -d bluff"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: runtime
      # The app's canonical address, baked into the Chrome extension zip served at /downloads/bluff-checkout-guard.zip.
      args: { BLUFF_APP_URL: "https://${BASE_DOMAIN:?set BASE_DOMAIN in .env}" }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Same-host database over the private compose network (no TLS needed inside it).
      DATABASE_URL: postgres://bluff:${POSTGRES_PASSWORD}@db:5432/bluff?sslmode=disable
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }

  tools:
    # One-off jobs: docker compose --profile tools run --rm tools npm run db:migrate | db:seed | nessie:seed | prewarm | db:reset
    build: { context: ., target: tools }
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://bluff:${POSTGRES_PASSWORD}@db:5432/bluff?sslmode=disable
    depends_on:
      db: { condition: service_healthy }

  backup:
    # Nightly pg_dump into ./backups (keeps 7). Run: docker compose --profile ops up -d backup
    image: timescale/timescaledb:2.21.3-pg17
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U bluff -d bluff -Fc -f /backups/bluff-$$(date +%F).dump && ls -1t /backups/*.dump | tail -n +8 | xargs -r rm --; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./stores:/srv/stores:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
